<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Ticket</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="navbar"></div>

<main class="main-content">
    <section class="page-header">
        <div>
            <h1>Skapa ny ticket</h1>
            <p class="muted">Freshdesk Style</p>
        </div>
    </section>

    <section class="card">
        <form id="createTicketForm">
            <div class="form-group">
                <label for="title">Titel</label>
                <input type="text" id="title" placeholder="Vad handlar ärendet om?" required />
            </div>

            <div class="form-group">
                <label for="description">Beskrivning</label>
                <textarea id="description" rows="8" placeholder="Beskriv ärendet i detalj..." required></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                <div class="form-group">
                    <label for="priority">Prioritet</label>
                    <select id="priority" required>
                        <option value="">Välj...</option>
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="issueType">Ärendetyp</label>
                    <select id="issueType" required>
                        <option value="">Välj...</option>
                        <option value="SOFTWARE">Software</option>
                        <option value="HARDWARE">Hardware</option>
                        <option value="NETWORK">Network</option>
                        <option value="ACCESS">Access</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="assignedStaff">Tilldela personal (Välj minst en)</label>
                <select id="assignedStaff" required class="dashboard-assignment-select">
                    <option value="">Välj personal...</option>
                    <!-- Populeras via JS -->
                </select>
                <div id="selectedStaffBadges" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px;"></div>
            </div>

            <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary">Skapa ärende</button>
                <a href="/pages/dashboard.html" class="btn btn-secondary">Avbryt</a>
            </div>
        </form>
        <p id="createMessage" class="message"></p>
    </section>
</main>

<script src="/js/app.js"></script>
<script>
    renderNavbar();
    loadStaffList("assignedStaff");
    setupCreateTicketForm();

    // Hantera val av personal via dropdown
    const staffSelect = document.getElementById('assignedStaff');
    const selectedStaffIds = new Set();
    const badgeContainer = document.getElementById('selectedStaffBadges');

    staffSelect.addEventListener('change', (e) => {
        const staffId = parseInt(e.target.value);
        if (!staffId || selectedStaffIds.has(staffId)) return;

        const staffName = e.target.options[e.target.selectedIndex].text;
        selectedStaffIds.add(staffId);

        const badge = document.createElement('span');
        badge.className = 'badge badge-assigned';
        badge.innerHTML = `${staffName} <span style="cursor:pointer; margin-left:5px;">&times;</span>`;
        badge.onclick = () => {
            selectedStaffIds.delete(staffId);
            badge.remove();
            updateRequiredStatus();
        };
        badgeContainer.appendChild(badge);
        staffSelect.value = ""; // Återställ dropdown
        updateRequiredStatus();
    });

    function updateRequiredStatus() {
        // Om vi har valt minst en person behöver dropdownen inte vara 'required' i sig för HTML5-validering 
        // eftersom vi kollar detta i JS vid submit, men vi kan styra det för att trigga webbläsarens inbyggda meddelande.
        staffSelect.required = selectedStaffIds.size === 0;
    }
    
    // Vi behöver skicka med dessa IDs vid submit
    window.getSelectedStaffIds = () => Array.from(selectedStaffIds);
</script>
</body>
</html>
