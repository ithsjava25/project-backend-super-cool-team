<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Detail</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="navbar"></div>

<main class="main-content">
    <section class="page-header">
        <div>
            <h1>Ticketdetaljer</h1>
            <p class="muted">Status och kommunikation</p>
        </div>
        <a id="editTicketLink" href="#" class="btn btn-primary">Redigera ärende</a>
    </section>

    <div id="ticketDetail"></div>

    <section id="assignmentSection" class="card" style="display:none;">
        <h2>Tilldela personal</h2>
        <div class="form-group">
            <select id="reassignStaff" class="dashboard-assignment-select" style="width: 100%; margin-bottom: 1rem;">
                <option value="">Lägg till personal...</option>
                <!-- Populeras via JS -->
            </select>
            <div id="reassignStaffBadges" style="margin-bottom: 1rem; display: flex; flex-wrap: wrap; gap: 5px;"></div>
            <button id="reassignBtn" class="btn btn-secondary">Uppdatera tilldelning</button>
        </div>
        <p id="assignMessage" class="message"></p>
    </section>

    <section class="card">
        <h2>Filer och Kommentarer</h2>
        <div id="commentsList" class="comments-list"></div>

        <form id="commentForm" style="margin-top: 2rem;">
            <div class="form-group">
                <label for="commentText">Skriv en uppdatering</label>
                <textarea id="commentText" rows="4" placeholder="Vad händer i ärendet?" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Skicka meddelande</button>
        </form>
        <p id="commentMessage" class="message"></p>
    </section>

    <section class="card">
        <h2>Ladda upp dokument</h2>
        <form id="uploadForm">
            <input type="number" id="uploadedById" value="1" hidden />
            <input type="file" id="ticketFile" style="margin-bottom: 1rem;" required />
            <button type="submit" class="btn btn-secondary">Ladda upp fil</button>
        </form>
        <p id="uploadMessage" class="message"></p>
    </section>
</main>

<script src="/js/common.js"></script>
<script src="/js/online-staff.js"></script>
<script src="/js/ticket-detail.js"></script>>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // Hantera val av personal via dropdown i detaljvyn
        const reassignSelect = document.getElementById('reassignStaff');
        const badgeContainer = document.getElementById('reassignStaffBadges');
        window.currentAssignedIds = new Set();

        window.addStaffBadge = (id, name) => {
            if (window.currentAssignedIds.has(id)) return;
            window.currentAssignedIds.add(id);
            const badge = document.createElement('span');
            badge.className = 'badge badge-assigned';
            badge.append(document.createTextNode(`${name} `));
            const removeIcon = document.createElement('span');
            removeIcon.style.cursor = 'pointer';
            removeIcon.style.marginLeft = '5px';
            removeIcon.textContent = '×';
            badge.appendChild(removeIcon);
            badge.onclick = () => {
                window.currentAssignedIds.delete(id);
                badge.remove();
            };
            badgeContainer.appendChild(badge);
        };

        window.clearStaffBadges = () => {
            window.currentAssignedIds.clear();
            badgeContainer.innerHTML = '';
        };

        reassignSelect.addEventListener('change', (e) => {
            const staffId = parseInt(e.target.value);
            if (!staffId || window.currentAssignedIds.has(staffId)) return;

            const staffName = e.target.options[e.target.selectedIndex].text;
            addStaffBadge(staffId, staffName);
            reassignSelect.value = "";
        });

        await initTicketDetail();
    });
</script>
</body>
</html>
