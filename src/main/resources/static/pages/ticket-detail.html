<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Detail</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="navbar"></div>

<main class="page-container">
    <section class="page-header">
        <div>
            <h1>Ticket Detail</h1>
            <p class="muted">Visa all information om ett ärende</p>
        </div>
        <a id="editTicketLink" href="#" class="btn btn-primary">Redigera</a>
    </section>

    <section class="card">
        <div id="ticketDetail"></div>
    </section>

    <section class="card">
        <h2>Ladda upp fil</h2>
        <form id="uploadForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="uploadedById">Uploaded By ID</label>
                    <input type="number" id="uploadedById" required />
                </div>

                <div class="form-group">
                    <label for="ticketFile">Välj fil</label>
                    <input type="file" id="ticketFile" required />
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Ladda upp</button>
        </form>
        <p id="uploadMessage" class="message"></p>
    </section>

    <section class="card">
        <h2>Kommentarer</h2>
        <div id="commentsList" class="comments-list"></div>

        <form id="commentForm" class="comment-form">
            <div class="form-group">
                <label for="commentText">Ny kommentar</label>
                <textarea id="commentText" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Lägg till kommentar</button>
        </form>

        <p id="commentMessage" class="message"></p>
    </section>
</main>

<script src="/js/app.js"></script>
<script>
    renderNavbar();
    loadTicketDetail();
    setupUploadForm();
    setupCommentForm();
</script>
</body>
</html>
