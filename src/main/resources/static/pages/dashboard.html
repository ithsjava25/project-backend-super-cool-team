<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Cyber Watch</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="navbar"></div>

<main class="page-container">
    <section class="page-header">
        <div>
            <h1>Ticket Dashboard</h1>
            <p class="muted">Översikt över alla ärenden</p>
        </div>
        <a href="/pages/create-ticket.html" class="btn btn-primary">+ Skapa ticket</a>
    </section>

    <section class="stats-grid">
        <div class="card stat-card">
            <h3>Totalt</h3>
            <p id="totalTickets">0</p>
        </div>
        <div class="card stat-card">
            <h3>Öppna</h3>
            <p id="openTickets">0</p>
        </div>
        <div class="card stat-card">
            <h3>Pågående</h3>
            <p id="inProgressTickets">0</p>
        </div>
        <div class="card stat-card">
            <h3>Stängda</h3>
            <p id="closedTickets">0</p>
        </div>
    </section>

    <section class="card">
        <h2>Sök och filter</h2>

        <div class="filter-row">
            <input type="text" id="searchInput" placeholder="Sök på titel..." />

            <select id="statusFilter">
                <option value="">Alla statusar</option>
                <option value="SUBMITTED">Submitted</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="CLOSED">Closed</option>
            </select>

            <select id="priorityFilter">
                <option value="">Alla prioriteter</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
                <option value="CRITICAL">Critical</option>
            </select>

            <button id="filterBtn" class="btn btn-secondary">Filtrera</button>
        </div>
    </section>

    <section class="card">
        <h2>Tickets</h2>
        <div id="ticketList" class="ticket-list"></div>
    </section>
</main>

<script src="/js/app.js"></script>
<script>
    renderNavbar();
    loadDashboardTickets();

    document.getElementById("filterBtn").addEventListener("click", loadDashboardTickets);
</script>
</body>
</html>
