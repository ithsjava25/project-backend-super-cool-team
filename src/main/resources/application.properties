spring.application.name=CyberWatch
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.s3.endpoint=${S3_ENDPOINT}
app.s3.region=eu-north-1
app.s3.accessKey=${S3_ACCESS_KEY}
app.s3.secretKey=${S3_SECRET_KEY}
app.s3.bucket=ticket-files
app.s3.allowed-origins=http://localhost:8080
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
app.encryption.password=${ENCRYPTION_PASSWORD}
app.encryption.pepper=${ENCRYPTION_PEPPER}
app.encryption.hmac-key=${APP_ENCRYPTION_HMAC_KEY}

management.endpoints.web.exposure.include=logfile
management.endpoint.logfile.enabled=true
logging.file.name=logs/cyberwatch.log